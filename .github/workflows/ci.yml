name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    name: ci/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci || npm install
      - run: npm run test --if-present
      - run: npm run build --if-present
